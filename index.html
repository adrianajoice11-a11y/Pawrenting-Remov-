    <script>
      // Suppress benign WebSocket/HMR transport connection errors in sandboxed iframe environment
      window.addEventListener('error', function (event) {
        var msg = (event && event.message) ? String(event.message) : '';
        if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('createWebSocketModuleRunnerTransport')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = (event && event.reason) ? String(event.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('vite') || reason.includes('createWebSocketModuleRunnerTransport')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
